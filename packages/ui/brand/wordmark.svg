<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64" role="img" aria-label="Seply Learn">
  <title>Seply Learn</title>
  <!-- Text needs Newsreader and IBM Plex Sans; the app renders the wordmark
       with the <Wordmark> component, which uses the loaded fonts. -->
  <style>
    .ink { stroke: #1D1C1A; fill: #1D1C1A; }
    .accent { fill: #3A45B5; }
    .seply { font-family: "Newsreader Variable", Newsreader, Georgia, serif; font-weight: 500; font-size: 36px; }
    .learn { font-family: "IBM Plex Sans Variable", "IBM Plex Sans", system-ui, sans-serif; font-weight: 400; font-size: 30px; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #ECE9E3; fill: #ECE9E3; }
      .accent { fill: #8E97F2; }
    }
  </style>
  <g transform="translate(4 4) scale(0.875)">
    <g class="ink" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M32 52 L32 61" />
      <path d="M32 52 L10 24" />
      <path d="M32 52 L20 15" />
      <path d="M32 52 L32 11" />
      <path d="M32 52 L44 15" />
      <path d="M32 52 L54 24" />
    </g>
    <g class="ink" stroke="none">
      <circle cx="10" cy="24" r="4.5" />
      <circle cx="20" cy="15" r="4.5" />
      <circle cx="32" cy="11" r="4.5" />
      <circle cx="54" cy="24" r="4.5" />
    </g>
    <circle class="accent" cx="44" cy="15" r="4.5" />
  </g>
  <text x="68" y="44" class="ink" stroke="none"><tspan class="seply">Seply</tspan><tspan class="learn" dx="8">Learn</tspan></text>
</svg>
