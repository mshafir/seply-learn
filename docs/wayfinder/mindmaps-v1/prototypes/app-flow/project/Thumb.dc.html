<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Graph thumbnail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

<div style="width: 220px; height: 110px; position: relative; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1D1C1A">

      <rect x="122" y="38" width="28" height="8" rx="4" fill="{{color}}"></rect><rect x="122" y="70" width="22" height="8" rx="4" fill="#059669"></rect><rect x="148" y="70" width="26" height="8" rx="4" fill="#F59E0B"></rect>

  <sc-if value="{{is.learning}}" hint-placeholder-val="{{false}}">

      <circle cx="30" cy="30" r="5" fill="{{color}}"></circle><circle cx="90" cy="22" r="5" fill="{{color}}"></circle><circle cx="150" cy="34" r="5" fill="{{color}}"></circle><circle cx="190" cy="26" r="5" fill="{{color}}"></circle>
      <circle cx="40" cy="80" r="5" fill="#0f766e"></circle><circle cx="110" cy="80" r="5" fill="#0f766e"></circle><circle cx="150" cy="80" r="5" fill="#0f766e"></circle><circle cx="190" cy="72" r="5" fill="#0f766e"></circle>

  <sc-if value="{{is.table}}" hint-placeholder-val="{{false}}">
    <svg width="220" height="110" viewBox="0 0 220 110" fill="none" aria-hidden="true">

      <rect x="20" y="10" width="180" height="18" rx="8" fill="#F1EFEA"></rect>

      <circle cx="100" cy="37" r="4" fill="#059669"></circle><circle cx="136" cy="37" r="4" fill="#DC2626"></circle><circle cx="172" cy="37" r="4" fill="#059669"></circle>
      <circle cx="100" cy="55" r="4" fill="#059669"></circle><circle cx="136" cy="55" r="4" fill="#059669"></circle><circle cx="172" cy="55" r="4" fill="#059669"></circle>

    </svg>
  </sc-if>
  <sc-if value="{{is.evidence}}" hint-placeholder-val="{{false}}">
    <svg width="220" height="110" viewBox="0 0 220 110" fill="none" aria-hidden="true">
      <path d="M46 22 L96 55 M46 55 L96 55 M46 88 L96 55 M124 55 L174 30 M124 55 L174 80" stroke="#C9C5BC" stroke-width="1.5"></path>
      <rect x="26" y="15" width="30" height="14" rx="4" fill="#4f46e5"></rect><rect x="26" y="48" width="30" height="14" rx="4" fill="#4f46e5"></rect><rect x="26" y="81" width="30" height="14" rx="4" fill="#4f46e5" opacity="0.6"></rect>
      <rect x="92" y="42" width="36" height="26" rx="6" fill="#FEF3C7" stroke="#CA8A04" stroke-width="1.6"></rect>
      <rect x="164" y="23" width="30" height="14" rx="4" fill="#D97706"></rect><rect x="164" y="73" width="30" height="14" rx="4" fill="#D97706" opacity="0.6"></rect>
    </svg>
  </sc-if>
  <sc-if value="{{is.rates}}" hint-placeholder-val="{{false}}">
    <svg width="220" height="110" viewBox="0 0 220 110" fill="none" aria-hidden="true">
      <path d="M20 98 H200 M60 94 V100 M110 94 V100 M160 94 V100" stroke="#C9C5BC" stroke-width="1.5"></path>
      <path d="M110 8 V92" stroke="#DDD9D1" stroke-dasharray="3 3"></path>
      <rect x="120" y="14" width="60" height="8" rx="4" fill="#DC2626"></rect><rect x="132" y="28" width="30" height="8" rx="4" fill="#DC2626" opacity="0.7"></rect>
      <rect x="36" y="48" width="56" height="8" rx="4" fill="{{color}}"></rect><rect x="50" y="62" width="44" height="8" rx="4" fill="{{color}}" opacity="0.7"></rect><rect x="24" y="76" width="40" height="8" rx="4" fill="{{color}}" opacity="0.5"></rect>
    </svg>
  </sc-if>
  <sc-if value="{{is.cause}}" hint-placeholder-val="{{false}}">
    <svg width="220" height="110" viewBox="0 0 220 110" fill="none" aria-hidden="true">
      <path d="M50 22 L100 45 M50 55 L100 45 M50 88 L100 70 M112 50 L160 58 M112 70 L160 58" stroke="#DC2626" stroke-width="1.6"></path>
      <path d="M50 55 L100 70" stroke="#16A34A" stroke-width="1.6"></path>
      <rect x="22" y="14" width="30" height="16" rx="4" fill="#FFFFFF" stroke="#C9C5BC"></rect><rect x="22" y="47" width="30" height="16" rx="4" fill="#FFFFFF" stroke="{{color}}" stroke-width="2"></rect><rect x="22" y="80" width="30" height="16" rx="4" fill="#FFFFFF" stroke="#C9C5BC"></rect>
      <rect x="98" y="38" width="28" height="16" rx="4" fill="#FFFFFF" stroke="#C9C5BC"></rect><rect x="98" y="63" width="28" height="16" rx="4" fill="#FFFFFF" stroke="#C9C5BC"></rect>
      <rect x="158" y="46" width="42" height="24" rx="6" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.6"></rect>
    </svg>
  </sc-if>
  <sc-if value="{{is.timeline}}" hint-placeholder-val="{{false}}">
    <svg width="220" height="110" viewBox="0 0 220 110" fill="none" aria-hidden="true">
      <path d="M14 36 H206 M14 66 H206 M14 96 H206" stroke="#EDEAE3"></path>
      <path d="M40 8 V100 M100 8 V100 M160 8 V100" stroke="#EDEAE3"></path>
      <rect x="24" y="16" width="70" height="12" rx="6" fill="{{color}}"></rect><rect x="110" y="16" width="86" height="12" rx="6" fill="{{color}}" opacity="0.4"></rect>
      <rect x="60" y="46" width="90" height="12" rx="6" fill="#0f766e"></rect>
      <path d="M44 80 l6 -6 l6 6 l-6 6 z M124 80 l6 -6 l6 6 l-6 6 z M176 80 l6 -6 l6 6 l-6 6 z" fill="#64748b"></path>
    </svg>
  </sc-if>
  <sc-if value="{{is.map}}" hint-placeholder-val="{{false}}">
    <svg width="220" height="110" viewBox="0 0 220 110" fill="none" aria-hidden="true">
      <rect x="0" y="0" width="220" height="110" fill="#E0F2FE"></rect>
      <path d="M30 100 C24 70 50 58 64 40 C80 20 120 14 150 22 C180 30 200 52 196 80 C194 96 180 106 170 110 L36 110 Z" fill="#F1EFEA" stroke="#DDD9D1"></path>
      <path d="M110 54 L150 38 M110 54 L88 80" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="4 3"></path>
      <circle cx="70" cy="62" r="5" fill="#8A857C"></circle><circle cx="130" cy="78" r="5" fill="#8A857C"></circle><circle cx="170" cy="60" r="5" fill="#8A857C"></circle>
      <circle cx="150" cy="38" r="5" fill="#7c3aed"></circle><circle cx="88" cy="80" r="5" fill="#7c3aed"></circle>
      <circle cx="110" cy="54" r="9" fill="{{color}}" stroke="#FFFFFF" stroke-width="2.5"></circle>
    </svg>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["outline","anatomy","learning","lineage","quadrant","table","evidence","rates","cause","timeline","map"],"default":"learning"},"color":{"editor":"color","default":"#2563eb","options":["#2563eb","#ea580c","#059669","#9333ea"]},"$preview":{"width":220,"height":110}}'>
class Component extends DCLogic {
  renderVals() {
    const kind = this.props.kind ?? 'learning';
    const kinds = ['outline', 'anatomy', 'learning', 'lineage', 'quadrant', 'table', 'evidence', 'rates', 'cause', 'timeline', 'map'];
    const is = {};
    for (const k of kinds) is[k] = kind === k;
    return { is, color: this.props.color ?? '#2563eb' };
  }
}
</script>
</body>
</html>
