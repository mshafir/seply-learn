name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (deps, typecheck, lint, tests) and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: pnpm check
        run: pnpm check

      - name: pnpm check:private
        run: pnpm check:private

      - name: Build web
        run: pnpm --filter web build

      - name: Bundle the Worker (dry run, no Cloudflare account needed)
        run: pnpm --filter @seply/worker bundle

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The API tests (apps/web/e2e/api) run the Worker (`wrangler dev`) against this.
    services:
      postgres:
        # The official image through Google's mirror: Docker Hub rate-limits
        # unauthenticated pulls per runner IP.
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: seply
          POSTGRES_PASSWORD: seply
          POSTGRES_DB: seply_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seply"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://seply:seply@localhost:5432/seply_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
        run: pnpm --filter @seply/server db:migrate

      # The Worker serves apps/web/dist; build it before Playwright starts servers.
      - name: Build web
        run: pnpm --filter web build

      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium and its system dependencies
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm --filter web test:e2e

      # The Views harness screenshots (packages/views/e2e). Its Playwright
      # version can differ from web's, so it installs its own Chromium.
      - name: Run Views harness e2e
        if: ${{ !cancelled() }}
        run: |
          pnpm --filter @seply/views exec playwright install chromium
          pnpm --filter @seply/views test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            packages/views/playwright-report/
            packages/views/test-results/
          retention-days: 14

  # WP-6.1: the Node entry (apps/server-node). Its database tests (the pg-boss
  # runner, two instances sharing live edits through LISTEN/NOTIFY), the S3
  # blob store against a real S3-compatible server (moto), then the API and
  # app e2e projects against server-node instead of the Worker.
  e2e-node:
    name: Node entry (tests and Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # The official image through Google's mirror: Docker Hub rate-limits
        # unauthenticated pulls per runner IP.
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: seply
          POSTGRES_PASSWORD: seply
          POSTGRES_DB: seply_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seply"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://seply:seply@localhost:5432/seply_e2e
      E2E_SERVER: node
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Apply database migrations (server-node migrate)
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
        run: pnpm --filter @seply/server-node migrate

      - name: Start an S3-compatible server (moto)
        run: |
          pipx run --spec 'moto[server]' moto_server -p 5055 > /tmp/moto.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:5055/ && exit 0; sleep 1; done
          cat /tmp/moto.log; exit 1

      - name: server-node tests (Postgres, two instances, S3)
        env:
          TEST_DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          S3_TEST_ENDPOINT: http://127.0.0.1:5055
        run: pnpm --filter @seply/server-node test

      # server-node serves apps/web/dist; build it before Playwright starts servers.
      - name: Build web
        run: pnpm --filter web build

      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium and its system dependencies
        run: pnpm --filter web exec playwright install --with-deps chromium

      # The UI-only projects don't touch the server; the Playwright job runs them.
      - name: Run e2e tests against server-node
        run: pnpm --filter web test:e2e --project=api --project=app-light --project=app-dark

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-node
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
