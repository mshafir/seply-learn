# The self-host image (spec §2.10; WP-6.2; docs/self-host.md).
#
# - Pull requests that touch what goes into it, and main: build the image
#   with docker compose and run the compose smoke test (scripts/compose-smoke.sh:
#   app + Postgres + MinIO, sign up through the UI, import a fixture, start a
#   build that reaches the model call with no real AI, Source files in the
#   bucket, the Map View on a PMTiles extract).
# - Release tags (v*): the same smoke, then publish the image to GHCR,
#   ghcr.io/mshafir/seply-learn, for linux/amd64 and linux/arm64, tagged with
#   the version (1.2.3, 1.2) and latest (not for a prerelease such as
#   v1.0.0-rc.1).
name: Image

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - .env.example
      - apps/server-node/**
      - apps/web/**
      - packages/**
      - docs/view-types/**
      - pnpm-lock.yaml
      - package.json
      - scripts/compose-smoke.sh
      - .github/workflows/image.yml
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # pnpm and Playwright for the smoke's browser test (the image builds itself).
      - uses: ./.github/actions/setup

      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium and its system dependencies
        run: pnpm --filter web exec playwright install --with-deps chromium

      # Docker Hub rate-limits unauthenticated pulls per runner IP. Pull its
      # images through Google's mirror and tag them with their usual names
      # (falling back to Docker Hub); compose and the build then use them.
      - name: Pull Docker Hub images through mirror.gcr.io
        env:
          POSTGRES_PASSWORD: unused
          BETTER_AUTH_SECRET: unused
        run: |
          node_image=$(sed -n 's/^ARG NODE_IMAGE=//p' Dockerfile)
          images="$node_image $(docker compose --profile s3 config --images | grep -v '^seply-learn' | sort -u)"
          for image in $images; do
            case "$image" in */*) path=$image ;; *) path=library/$image ;; esac
            if docker pull -q "mirror.gcr.io/$path"; then
              docker tag "mirror.gcr.io/$path" "$image"
            else
              docker pull -q "$image"
            fi
          done
          docker image ls

      - name: docker compose up, then the smoke test (MinIO and tiles too)
        run: scripts/compose-smoke.sh --s3 --tiles

      - name: Image size
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Self-host image"
            docker image ls seply-learn:smoke --format 'seply-learn:smoke: {{.Size}} on disk'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-compose
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  publish:
    name: Publish to GHCR
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
