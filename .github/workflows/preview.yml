# Per-PR previews and production deploys. See docs/ops/deploy.md.
#
# The app's jobs are gated on three repo secrets (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# NEON_API_KEY) and the NEON_PROJECT_ID variable (as Neon's GitHub integration sets it). Without them the workflow skips with a notice, so it
# is safe to merge before the accounts exist (issue #40) and on PRs from forks.
# The site's jobs (apps/site: the seply-site Worker on seply.app) need only the two Cloudflare secrets.
name: Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  # Production deploys after CI passes on main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  # One run per PR (a close cancels a deploy still in flight); production runs in order.
  group: deploy-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PR: ${{ github.event.pull_request.number }}
  WORKER_PREVIEW: seply-pr-${{ github.event.pull_request.number }}
  SITE_PREVIEW: seply-site-pr-${{ github.event.pull_request.number }}
  NEON_BRANCH_PREVIEW: preview/pr-${{ github.event.pull_request.number }}

jobs:
  gate:
    name: Secrets present?
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
      # The site's jobs need only the Cloudflare secrets.
      cloudflare: ${{ steps.check.outputs.cloudflare }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEON_API_KEY NEON_PROJECT_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::notice title=Deploys skipped::Missing repo secrets or variables: ${missing[*]}. Previews and production deploys activate once they exist (see docs/ops/deploy.md, issue #40)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "cloudflare=true" >> "$GITHUB_OUTPUT"
          else
            echo "cloudflare=false" >> "$GITHUB_OUTPUT"
          fi

  preview:
    name: Deploy preview
    needs: gate
    if: >-
      needs.gate.outputs.enabled == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build web
        env:
          # The Map View's PMTiles (docs/ops/basemap-tiles.md); unset: the OpenFreeMap fallback.
          VITE_MAP_TILES_URL: ${{ vars.MAP_TILES_URL }}
        run: pnpm --filter web build

      - name: Create (or reuse) the Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ env.NEON_BRANCH_PREVIEW }}

      # Direct (non-pooled) connection: migrations take locks Hyperdrive can't hold.
      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: pnpm --filter @seply/server db:migrate

      - name: Point a Hyperdrive config at the branch
        working-directory: apps/worker
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: node scripts/ci.mjs hyperdrive-upsert "$WORKER_PREVIEW"

      # Source files: one bucket shared by every preview (keys are per Expedition).
      - name: Point the Sources bucket binding at the preview bucket
        working-directory: apps/worker
        run: node scripts/ci.mjs r2-bucket seply-sources-preview

      - name: Work out the Worker URLs
        id: urls
        working-directory: apps/worker
        env:
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
        run: node scripts/ci.mjs worker-urls "$WORKER_PREVIEW"

      - name: Write the Worker secrets file
        working-directory: apps/worker
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AI_KEYS_MASTER_KEY: ${{ secrets.AI_KEYS_MASTER_KEY }}
          # Optional: web push is off without them (docs/ops/deploy.md).
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          # Optional: invite emails are off without it (WP-5.1).
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/ci.mjs secrets-file "$RUNNER_TEMP/worker-secrets.json"

      # Google sign-in goes through production (AUTH_PROXY_URL): Google only
      # knows production's callback. See docs/ops/deploy.md.
      - name: Deploy the preview Worker
        id: deploy
        working-directory: apps/worker
        env:
          URL: ${{ steps.urls.outputs.url }}
          PRODUCTION_URL: ${{ steps.urls.outputs.production_url }}
          PREVIEW_ORIGINS: ${{ steps.urls.outputs.preview_origins }}
          # The invite sender; empty: the server's default.
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/worker-secrets.json"' EXIT
          # The sender only when the repo variable is set (else the server's default).
          mail=()
          if [ -n "$EMAIL_FROM" ]; then mail=(--var "EMAIL_FROM:$EMAIL_FROM"); fi
          pnpm exec wrangler deploy --config wrangler.ci.json \
            --name "$WORKER_PREVIEW" \
            --secrets-file "$RUNNER_TEMP/worker-secrets.json" \
            --var "DB_BRANCH:$NEON_BRANCH_PREVIEW" \
            --var "BETTER_AUTH_URL:$URL" \
            --var "AUTH_PROXY_URL:$PRODUCTION_URL" \
            --var "AUTH_TRUSTED_ORIGINS:$PREVIEW_ORIGINS" \
            "${mail[@]}" | tee deploy.log
          deployed=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n1)
          if [ "$deployed" != "$URL" ]; then
            echo "::error::Deployed to '$deployed', expected $URL. Is the workers.dev subdomain set up? (docs/ops/deploy.md)"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Check /api/health
        id: health
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          # A fresh workers.dev hostname can take a moment to resolve.
          for _ in $(seq 1 12); do
            if body=$(curl -fsS "$URL/api/health"); then
              echo "$body"
              echo "body=$body" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$URL/api/health did not answer"
          exit 1

      - name: Check Google sign-in goes through production
        id: signin
        env:
          URL: ${{ steps.deploy.outputs.url }}
          PRODUCTION_URL: ${{ steps.urls.outputs.production_url }}
        run: node apps/worker/scripts/check-signin.mjs "$URL" "$PRODUCTION_URL"

      - name: Comment the preview URL
        uses: actions/github-script@v9
        env:
          URL: ${{ steps.deploy.outputs.url }}
          HEALTH: ${{ steps.health.outputs.body }}
          REDIRECT_URI: ${{ steps.signin.outputs.redirect_uri }}
        with:
          script: |
            const marker = "<!-- seply-preview -->"
            const body = [
              marker,
              `**Preview:** ${process.env.URL}`,
              "",
              `- Worker: \`${process.env.WORKER_PREVIEW}\``,
              `- Neon branch: \`${process.env.NEON_BRANCH_PREVIEW}\``,
              `- \`/api/health\`: \`${process.env.HEALTH}\``,
              `- Google sign-in: redirects to Google with \`redirect_uri=${process.env.REDIRECT_URI}\` (production, through the OAuth proxy)`,
              `- Commit: ${context.payload.pull_request.head.sha}`,
            ].join("\n")
            await upsertComment(body)

            async function upsertComment(body) {
              const { owner, repo } = context.repo
              const issue_number = context.payload.pull_request.number
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
              const mine = comments.find((c) => c.body?.includes(marker))
              if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body })
              else await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

  teardown:
    name: Tear down preview
    needs: gate
    if: >-
      needs.gate.outputs.enabled == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: apps/worker/scripts
      - uses: jdx/mise-action@v4

      # Order matters: the Worker binds the Hyperdrive config, which points at the branch.
      # Each step is a no-op when its resource is already gone.
      - name: Delete the preview Worker
        run: node apps/worker/scripts/ci.mjs worker-delete "$WORKER_PREVIEW"

      - name: Delete the Hyperdrive config
        run: node apps/worker/scripts/ci.mjs hyperdrive-delete "$WORKER_PREVIEW"

      - name: Delete the Neon branch
        run: node apps/worker/scripts/ci.mjs neon-branch-delete "$NEON_BRANCH_PREVIEW"

      - name: Mark the preview comment as torn down
        uses: actions/github-script@v9
        with:
          script: |
            const marker = "<!-- seply-preview -->"
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const mine = comments.find((c) => c.body?.includes(marker))
            if (mine) {
              const body = `${marker}\n**Preview torn down** (PR closed): Worker \`${process.env.WORKER_PREVIEW}\`, its Hyperdrive config and Neon branch \`${process.env.NEON_BRANCH_PREVIEW}\` were deleted.`
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body })
            }

  production:
    name: Deploy production
    needs: gate
    if: >-
      needs.gate.outputs.enabled == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI just passed, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/setup

      - name: Build web
        env:
          # The Map View's PMTiles (docs/ops/basemap-tiles.md); unset: the OpenFreeMap fallback.
          VITE_MAP_TILES_URL: ${{ vars.MAP_TILES_URL }}
        run: pnpm --filter web build

      - name: Look up the Neon default branch
        id: neon
        working-directory: apps/worker
        run: node scripts/ci.mjs neon-default-branch

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: pnpm --filter @seply/server db:migrate

      - name: Point the production Hyperdrive config at it
        working-directory: apps/worker
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: node scripts/ci.mjs hyperdrive-upsert seply-production

      - name: Point the Sources bucket binding at the production bucket
        working-directory: apps/worker
        run: node scripts/ci.mjs r2-bucket seply-sources

      - name: Work out the Worker URLs
        id: urls
        working-directory: apps/worker
        env:
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
        run: node scripts/ci.mjs worker-urls seply-learn

      # The zone must be on Cloudflare, and the token needs Zone: Read, DNS: Edit and
      # Workers Routes: Edit on it (docs/ops/deploy.md).
      - name: Attach the custom domain
        if: vars.PRODUCTION_DOMAIN != ''
        working-directory: apps/worker
        run: node scripts/ci.mjs custom-domain "${{ vars.PRODUCTION_DOMAIN }}"

      - name: Write the Worker secrets file
        working-directory: apps/worker
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AI_KEYS_MASTER_KEY: ${{ secrets.AI_KEYS_MASTER_KEY }}
          # Optional: web push is off without them (docs/ops/deploy.md).
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          # Optional: invite emails are off without it (WP-5.1).
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Hosted access approval (WP-7.3): the admins, comma-separated. A secret,
          # not a variable, so the addresses stay out of the public logs.
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: node scripts/ci.mjs secrets-file "$RUNNER_TEMP/worker-secrets.json"

      # AUTH_PROXY_URL is production itself: the OAuth proxy plugin only unwraps
      # callbacks that previews started. Previews are trusted origins.
      - name: Deploy
        id: deploy
        working-directory: apps/worker
        env:
          BRANCH: ${{ steps.neon.outputs.name }}
          URL: ${{ steps.urls.outputs.url }}
          PREVIEW_ORIGINS: ${{ steps.urls.outputs.preview_origins }}
          # The invite sender; empty: the server's default.
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          # Hosted access approval (WP-7.3): "1" turns it on; unset, it's off.
          ACCESS_APPROVAL: ${{ vars.ACCESS_APPROVAL }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/worker-secrets.json"' EXIT
          # The sender only when the repo variable is set (else the server's default).
          mail=()
          if [ -n "$EMAIL_FROM" ]; then mail=(--var "EMAIL_FROM:$EMAIL_FROM"); fi
          approval=()
          if [ -n "$ACCESS_APPROVAL" ]; then approval=(--var "ACCESS_APPROVAL:$ACCESS_APPROVAL"); fi
          pnpm exec wrangler deploy --config wrangler.ci.json \
            --secrets-file "$RUNNER_TEMP/worker-secrets.json" \
            --var "DB_BRANCH:$BRANCH" \
            --var "BETTER_AUTH_URL:$URL" \
            --var "AUTH_PROXY_URL:$URL" \
            --var "AUTH_TRUSTED_ORIGINS:$PREVIEW_ORIGINS" \
            "${mail[@]}" "${approval[@]}" | tee deploy.log
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Check /api/health
        if: steps.deploy.outputs.url != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          # A newly attached custom domain can take a moment to get its certificate.
          for _ in $(seq 1 18); do
            curl -fsS "$URL/api/health" && exit 0
            sleep 10
          done
          echo "::error::$URL/api/health did not answer"
          exit 1

      - name: Check Google sign-in uses production's callback
        if: steps.deploy.outputs.url != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: node apps/worker/scripts/check-signin.mjs "$URL" "$URL"

  # The site (apps/site): the seply-site Worker, static assets only, on seply.app.
  # No database, no secrets in the Worker. See docs/ops/deploy.md, "The site".

  site-preview:
    name: Deploy site preview
    needs: gate
    if: >-
      needs.gate.outputs.cloudflare == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.action != 'closed'
    runs-on: ubuntu-latest
    # Room for rendering the explainer (about 10 minutes) when no cached render fits.
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Only PRs that touch the site or what it is built from get a site preview.
      - name: Does this PR touch the site?
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          if grep -qE '^(apps/site|apps/video|packages/ui)/' <<< "$files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing under apps/site, apps/video or packages/ui changed: no site preview."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.paths.outputs.changed == 'true'
      - uses: ./.github/actions/setup
        if: steps.paths.outputs.changed == 'true'

      # The explainer and hero loop (WP-7.4), from the render CI cached for
      # these inputs; rendered here if this job gets there first.
      - uses: ./.github/actions/explainer-video
        if: steps.paths.outputs.changed == 'true'
        with:
          to: apps/site/public/media/video

      # SITE_ENV=preview: noindex on every page and in a header, and no analytics.
      - name: Build the site
        if: steps.paths.outputs.changed == 'true'
        env:
          SITE_ENV: preview
        run: pnpm --filter @seply/site build

      - name: Work out the Worker URL
        id: urls
        if: steps.paths.outputs.changed == 'true'
        working-directory: apps/worker
        run: node scripts/ci.mjs worker-urls "$SITE_PREVIEW"

      - name: Deploy the site preview Worker
        id: deploy
        if: steps.paths.outputs.changed == 'true'
        working-directory: apps/site
        env:
          URL: ${{ steps.urls.outputs.url }}
        run: |
          set -o pipefail
          pnpm exec wrangler deploy --name "$SITE_PREVIEW" | tee deploy.log
          deployed=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n1)
          if [ "$deployed" != "$URL" ]; then
            echo "::error::Deployed to '$deployed', expected $URL. Is the workers.dev subdomain set up? (docs/ops/deploy.md)"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Check the site preview
        id: check
        if: steps.paths.outputs.changed == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: node apps/site/scripts/check-deploy.mjs "$URL" preview

      - name: Comment the site preview URL
        if: steps.paths.outputs.changed == 'true'
        uses: actions/github-script@v9
        env:
          URL: ${{ steps.deploy.outputs.url }}
          SUMMARY: ${{ steps.check.outputs.summary }}
        with:
          script: |
            const marker = "<!-- seply-site-preview -->"
            const body = [
              marker,
              `**Site preview** (seply.app): ${process.env.URL}`,
              "",
              `- Worker: \`${process.env.SITE_PREVIEW}\``,
              `- \`/\`: ${process.env.SUMMARY}; the 404 page, \`/og.png\` and \`/sitemap.xml\` checked`,
              `- Commit: ${context.payload.pull_request.head.sha}`,
            ].join("\n")
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const mine = comments.find((c) => c.body?.includes(marker))
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body })
            else await github.rest.issues.createComment({ owner, repo, issue_number, body })

  site-teardown:
    name: Tear down site preview
    needs: gate
    if: >-
      needs.gate.outputs.cloudflare == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: apps/worker/scripts
      - uses: jdx/mise-action@v4

      # A no-op when the PR never had a site preview.
      - name: Delete the site preview Worker
        run: node apps/worker/scripts/ci.mjs script-delete "$SITE_PREVIEW"

      - name: Mark the site preview comment as torn down
        uses: actions/github-script@v9
        with:
          script: |
            const marker = "<!-- seply-site-preview -->"
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const mine = comments.find((c) => c.body?.includes(marker))
            if (mine) {
              const body = `${marker}\n**Site preview torn down** (PR closed): Worker \`${process.env.SITE_PREVIEW}\` was deleted.`
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body })
            }

  site-production:
    name: Deploy site
    needs: gate
    if: >-
      needs.gate.outputs.cloudflare == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    # Room for rendering the explainer (about 10 minutes) when no cached render fits.
    timeout-minutes: 35
    environment:
      name: site
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The custom domain; the repo variable SITE_DOMAIN=none keeps it on workers.dev.
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN || 'seply.app' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI just passed, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/setup

      # The explainer and hero loop (WP-7.4): CI rendered and cached them for this commit's inputs.
      - uses: ./.github/actions/explainer-video
        with:
          to: apps/site/public/media/video

      - name: Build the site
        env:
          SITE_ENV: production
          # The Web Analytics site token. It is public (the page carries it), so a
          # repo variable; a secret of the same name works too. Unset: no beacon.
          CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN || secrets.CF_ANALYTICS_TOKEN }}
        run: pnpm --filter @seply/site build

      # --domain attaches the custom domain (and its DNS record) to this Worker
      # only; previews deploy from the same config without it. The token needs
      # Zone: Read, DNS: Edit and Workers Routes: Edit on the zone (docs/ops/deploy.md).
      - name: Deploy
        id: deploy
        working-directory: apps/site
        run: |
          set -o pipefail
          domain=()
          if [ "$SITE_DOMAIN" != "none" ]; then domain=(--domain "$SITE_DOMAIN"); fi
          pnpm exec wrangler deploy "${domain[@]}" | tee deploy.log
          workers_dev=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n1)
          echo "workers_dev=$workers_dev" >> "$GITHUB_OUTPUT"
          if [ "$SITE_DOMAIN" != "none" ]; then
            echo "url=https://$SITE_DOMAIN" >> "$GITHUB_OUTPUT"
          else
            echo "url=$workers_dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the workers.dev URL
        if: steps.deploy.outputs.workers_dev != ''
        env:
          URL: ${{ steps.deploy.outputs.workers_dev }}
        run: node apps/site/scripts/check-deploy.mjs "$URL" production

      # A newly attached custom domain can take a few minutes to get its certificate.
      - name: Check the custom domain
        if: env.SITE_DOMAIN != 'none'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: node apps/site/scripts/check-deploy.mjs "$URL" production 30
